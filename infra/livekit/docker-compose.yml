version: '3.8'

# Cap container log files so docker json-file logs can't fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    # Mount config file to enable agents
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    command: ["--config", "/etc/livekit.yaml", "--bind", "0.0.0.0"]
    # API keys live in livekit.yaml — do NOT set LIVEKIT_KEYS="" here (overrides yaml and crashes)

  redis:
    image: redis:alpine
    container_name: livekit-redis
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "6379:6379"

  egress:
    image: livekit/egress:latest
    container_name: livekit-egress
    restart: unless-stopped
    logging: *default-logging
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml
      - ../../apps/agent/audio_storage:/out  # Mount local storage for recordings
    depends_on:
      - livekit
      - redis


