# Installed to /etc/nginx/conf.d/ (http context) before the vhosts that use it.
# Media playback tickets (review_media, workspace_media), LiveKit join tokens (access_token) and password-reset
# tokens travel in query strings, so access logs record the path only; "?[query]" marks that a query was present.
log_format spasht_no_query '$remote_addr - $remote_user [$time_local] "$request_method $uri$is_args$spasht_query_marker $server_protocol" '
                           '$status $body_bytes_sent "$spasht_referer_path" "$http_user_agent" $request_time';

map $is_args $spasht_query_marker {
    default "";
    "?"     "[query]";
}

# Referers can carry the same query strings; keep only the referring path.
map $http_referer $spasht_referer_path {
    default                 $http_referer;
    "~^(?<spasht_ref>[^?]*)\?" "$spasht_ref?[query]";
}
